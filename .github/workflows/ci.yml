name: Click iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # The forward-compatibility lane reports but never fails the run.
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Required: the current Apple toolchain (newest Xcode 26 on macOS 26, iOS 26 SDK).
          - name: build-and-test
            runner: macos-26
            xcode: "26"
            experimental: false
          # Forward compatibility: Xcode 27 / iOS 27 (GitHub's public-preview image).
          - name: xcode-27 (non-blocking)
            runner: xcode-27
            xcode: "27"
            experimental: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        env:
          XCODE_MAJOR: ${{ matrix.xcode }}
        run: |
          # Newest release Xcode of this major: betas and their symlinked aliases are skipped.
          DEVELOPER_DIR=$(python3 - <<'PY'
          import glob
          import os
          import re

          major = os.environ["XCODE_MAJOR"]
          apps = [
              path for path in glob.glob(f"/Applications/Xcode_{major}*.app")
              if not os.path.islink(path) and "beta" not in path.lower()
          ]

          def version(path):
              match = re.search(r"Xcode_(\d+)(?:\.(\d+))?(?:\.(\d+))?\.app$", path)
              return tuple(int(value or 0) for value in match.groups()) if match else (0, 0, 0)

          print(max(apps, key=version) if apps else "")
          PY
          )
          if [ -z "$DEVELOPER_DIR" ]; then
            echo "::error::No release Xcode $XCODE_MAJOR found on this runner"
            ls -d /Applications/Xcode* || true
            exit 1
          fi
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Main App and Extensions
        run: |
          xcodebuild build \
            -project Click.xcodeproj \
            -scheme Click \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Unit Tests
        run: |
          # An iPhone on the newest iOS runtime of the selected Xcode (names change every year).
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          runtimes = json.load(sys.stdin)["devices"]
          def version(key):
              match = re.search(r"iOS-(\d+)-(\d+)(?:-(\d+))?$", key)
              return tuple(int(v or 0) for v in match.groups()) if match else None
          ios = sorted((k for k in runtimes if version(k)), key=version, reverse=True)
          for key in ios:
              phones = [d for d in runtimes[key] if d["name"].startswith("iPhone")]
              if phones:
                  phones.sort(key=lambda d: ("Pro" not in d["name"], d["name"]))
                  print(phones[0]["udid"])
                  break
          ')
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No available iPhone simulator"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$DEVICE_ID"
          xcodebuild test \
            -project Click.xcodeproj \
            -scheme ClickTests \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO
