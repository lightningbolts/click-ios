name: Click iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          DEVELOPER_DIR=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$DEVELOPER_DIR" ]; then
            sudo xcode-select -s "$DEVELOPER_DIR"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Main App and Extensions
        run: |
          xcodebuild build \
            -project Click.xcodeproj \
            -scheme Click \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Unit Tests
        run: |
          DEVICE_NAME=$(xcrun simctl list devices available | grep -E "iPhone (16|15)" | head -n 1 | sed -E 's/^[[:space:]]+//; s/[[:space:]]+\(.*\).*$//')
          if [ -z "$DEVICE_NAME" ]; then DEVICE_NAME="iPhone 16"; fi
          xcodebuild test \
            -project Click.xcodeproj \
            -scheme ClickTests \
            -destination "platform=iOS Simulator,name=$DEVICE_NAME" \
            CODE_SIGNING_ALLOWED=NO
