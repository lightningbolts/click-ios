name: Click
options:
  bundleIdPrefix: compose.project.click
  deploymentTarget:
    iOS: "18.2"
  xcodeVersion: "16.0"

configs:
  Debug:
    type: debug
    config: Config/Debug.xcconfig
  Release:
    type: release
    config: Config/Release.xcconfig

targets:
  Click:
    type: application
    platform: iOS
    deploymentTarget: "18.2"
    sources:
      - path: Click
      - path: Resources/Assets.xcassets
      - path: Resources/Fonts
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: compose.project.click.click
      PRODUCT_NAME: Click
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: Click/Info.plist
      INFOPLIST_KEY_CFBundleDisplayName: "Click"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
      INFOPLIST_KEY_UIRequiresFullScreen: YES
      INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
      INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Click uses Bluetooth for Tap to Connect when you meet someone nearby."
      INFOPLIST_KEY_NSMicrophoneUsageDescription: "Click uses your microphone for Tap to Connect ultrasonic sensing and voice notes."
      INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Click reads your calendar to find mutual free time when you reconnect with a friend."
      INFOPLIST_KEY_NSCalendarsUsageDescription: "Click reads your calendar to find mutual free time when you reconnect with a friend."
      INFOPLIST_KEY_NSContactsUsageDescription: "Click hashes phone numbers and emails on this device to find people you already know. Your address book never leaves your phone."
      INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Click uses your location for tether pings, maps, and nearby connection features."
      INFOPLIST_KEY_NSCameraUsageDescription: "Click uses your camera to scan QR codes and capture photos."
      INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Click accesses your photo library to select photos for profile and chat."
      INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Click saves photos to your photo library."
      INFOPLIST_KEY_NSMotionUsageDescription: "Click uses motion context to capture encounter vibe."
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      CODE_SIGN_ENTITLEMENTS: Resources/Click.entitlements
      DEVELOPMENT_TEAM: W4C3V9Z2N4
      CODE_SIGN_STYLE: Automatic
      SWIFT_VERSION: "6.0"
    scheme:
      testTargets:
        - ClickTests
    dependencies:
      - target: ClickClip
        embed: true
      - target: NotificationService
        embed: true

  ClickClip:
    type: application.on-demand-install-capable
    platform: iOS
    deploymentTarget: "18.2"
    sources:
      - path: ClickClip
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: compose.project.click.click.Clip
      PRODUCT_NAME: ClickClip
      INFOPLIST_FILE: ClickClip/Info.plist
      INFOPLIST_KEY_CFBundleDisplayName: "Click"
      CODE_SIGN_ENTITLEMENTS: Resources/ClickClip.entitlements
      DEVELOPMENT_TEAM: W4C3V9Z2N4
      CODE_SIGN_STYLE: Automatic
      SWIFT_VERSION: "6.0"

  NotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.2"
    sources:
      - path: NotificationService
      - path: Click/Core/Crypto/ClickCryptoV1.swift
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: compose.project.click.click.NotificationService
      PRODUCT_NAME: NotificationService
      INFOPLIST_FILE: NotificationService/Info.plist
      INFOPLIST_KEY_CFBundleDisplayName: "NotificationService"
      DEVELOPMENT_TEAM: W4C3V9Z2N4
      CODE_SIGN_STYLE: Automatic
      SWIFT_VERSION: "6.0"

  ClickTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.2"
    sources:
      - path: Tests/ClickTests
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - target: Click
    scheme:
      testTargets:
        - ClickTests
    settings:
      PRODUCT_NAME: ClickTests
      PRODUCT_BUNDLE_IDENTIFIER: compose.project.click.ClickTests
      GENERATE_INFOPLIST_FILE: YES
      DEVELOPMENT_TEAM: W4C3V9Z2N4
      CODE_SIGN_STYLE: Automatic
      SWIFT_VERSION: "6.0"
